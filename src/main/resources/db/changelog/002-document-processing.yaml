databaseChangeLog:
  - changeSet:
      id: 002-create-processing-jobs-table
      author: docuflow
      changes:
        - createTable:
            tableName: processing_jobs
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_processing_jobs
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: document_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_processing_jobs_document
                    references: documents(id)
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: current_step
                  type: int
                  defaultValue: 0
              - column:
                  name: context
                  type: jsonb
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: timestamp
              - column:
                  name: completed_at
                  type: timestamp
              - column:
                  name: error_message
                  type: varchar(2000)
              - column:
                  name: retry_count
                  type: int
                  defaultValue: 0

  - changeSet:
      id: 002-create-job-steps-table
      author: docuflow
      changes:
        - createTable:
            tableName: job_steps
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_job_steps
              - column:
                  name: job_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_job_steps_job
                    references: processing_jobs(id)
              - column:
                  name: step_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: input
                  type: jsonb
              - column:
                  name: output
                  type: jsonb
              - column:
                  name: error_message
                  type: varchar(2000)
              - column:
                  name: retry_count
                  type: int
                  defaultValue: 0
              - column:
                  name: started_at
                  type: timestamp
              - column:
                  name: completed_at
                  type: timestamp

  - changeSet:
      id: 002-create-processing-jobs-indexes
      author: docuflow
      changes:
        - createIndex:
            tableName: processing_jobs
            indexName: idx_processing_jobs_tenant_id
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            tableName: processing_jobs
            indexName: idx_processing_jobs_document_id
            columns:
              - column:
                  name: document_id
        - createIndex:
            tableName: processing_jobs
            indexName: idx_processing_jobs_status
            columns:
              - column:
                  name: status
        - createIndex:
            tableName: processing_jobs
            indexName: idx_processing_jobs_created_at
            columns:
              - column:
                  name: created_at
        - createIndex:
            tableName: job_steps
            indexName: idx_job_steps_job_id
            columns:
              - column:
                  name: job_id
        - createIndex:
            tableName: job_steps
            indexName: idx_job_steps_status
            columns:
              - column:
                  name: status